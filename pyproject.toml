[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alfred-tools"
version = "0.1.0"
description = "Deterministic local tools used by Alfred"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.15.21"]
voice = ["faster-whisper>=1,<2"]

[project.scripts]
alfred-notes = "alfred_tools.notes.cli:main"
alfred-serve = "alfred_tools.orchestrator.server:main"
alfred-web-search = "alfred_tools.web.search:main"
alfred-web-fetch = "alfred_tools.web.fetch:main"
alfred-web-research = "alfred_tools.web.research:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alfred_tools = ["orchestrator/static/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
