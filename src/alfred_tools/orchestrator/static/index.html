<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alfred</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">LOCAL ASSISTANT</p>
          <h1>Alfred</h1>
        </div>
        <div class="header-actions">
          <button id="new-session" type="button">New conversation</button>
          <label>Model <select id="backend" aria-label="Model provider"></select></label>
        </div>
      </header>
      <section id="messages" aria-live="polite">
        <article class="alfred">What can I help with?</article>
      </section>
      <p id="status">This process keeps conversation history until the session ends.</p>
      <form id="chat-form">
        <textarea id="message" rows="2" maxlength="20000" placeholder="Message Alfred..." required></textarea>
        <button id="talk" type="button" title="Hold Shift+CapsLock">Hold to talk</button>
        <button id="send" type="submit">Send</button>
      </form>
      <footer>
        <span>Push to talk: <kbd>Shift</kbd> + <kbd>CapsLock</kbd></span>
        <div class="voice-settings">
          <label>Microphone <select id="transcription-provider"></select></label>
          <label>Spoken replies <select id="speech-output">
            <option value="off">Off</option>
          </select></label>
        </div>
      </footer>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
