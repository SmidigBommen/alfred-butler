# Alfred's private SearXNG configuration.
# Inherit upstream engine updates and override only our stable API requirements.
use_default_settings: true

general:
  debug: false
  instance_name: "Alfred Search"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  limiter: false
  public_instance: false
  image_proxy: false
  method: "POST"
