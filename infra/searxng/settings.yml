# Alfred's private SearXNG configuration.
# Inherit upstream engine updates and override only our stable API requirements.
use_default_settings: true

general:
  debug: false
  instance_name: "Alfred Search"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

# These providers repeatedly rate-limit this host and add latency and duplicate
# warnings without contributing useful results. Keep the overrides explicit so
# inheriting a new upstream default configuration does not re-enable them.
engines:
  - name: brave
    disabled: true
  - name: google cse
    disabled: true

server:
  limiter: false
  public_instance: false
  image_proxy: false
  method: "POST"
